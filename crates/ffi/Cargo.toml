[package]
name = "televisor-ffi"
version.workspace = true
edition.workspace = true
description = "C ABI over televisor-core for native frontends (the Apple TV app)"

[lib]
# staticlib for Xcode to link; rlib so `cargo test` can exercise the bridge.
crate-type = ["staticlib", "rlib"]

[dependencies]
televisor-core = { path = "../core" }
televisor-remux = { path = "../remux" }

jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
mockito.workspace = true
tempfile.workspace = true
